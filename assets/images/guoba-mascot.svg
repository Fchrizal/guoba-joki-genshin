<svg viewBox="0 0 240 185" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Rounded Bear Ears -->
  <circle cx="68" cy="36" r="19" fill="#F3A847" stroke="#2B1B15" stroke-width="4.2" />
  <circle cx="68" cy="36" r="9.5" fill="#C27A27" />
  <circle cx="172" cy="36" r="19" fill="#F3A847" stroke="#2B1B15" stroke-width="4.2" />
  <circle cx="172" cy="36" r="9.5" fill="#C27A27" />

  <!-- Upper Torso & Cream Belly Patch -->
  <path d="M60 165 C60 128 85 112 120 112 C155 112 180 128 180 165" fill="#F3A847" stroke="#2B1B15" stroke-width="4.2" stroke-linecap="round" />
  <path d="M78 165 C78 135 94 122 120 122 C146 122 162 135 162 165" fill="#FFF5EA" />

  <!-- Red Knot Emblem (∞) on Chest -->
  <path d="M112 142 C108 138 104 142 108 146 C114 150 126 138 132 142 C136 146 132 150 128 146 C122 142 110 154 112 142 Z" stroke="#D95B43" stroke-width="2.8" stroke-linecap="round" fill="none" />

  <!-- Chubby Guoba Head -->
  <ellipse cx="120" cy="72" rx="58" ry="48" fill="#F3A847" stroke="#2B1B15" stroke-width="4.2" />

  <!-- Iconic Cream Forehead Ring (Halo / Donut) -->
  <circle cx="120" cy="42" r="12" fill="#FFF5EA" stroke="#2B1B15" stroke-width="3.5" />
  <circle cx="120" cy="42" r="5.2" fill="#F3A847" stroke="#2B1B15" stroke-width="2.5" />

  <!-- Oval Dot Eyebrows -->
  <ellipse cx="98" cy="48" rx="4" ry="5.8" transform="rotate(-18 98 48)" fill="#2E221E" />
  <ellipse cx="142" cy="48" rx="4" ry="5.8" transform="rotate(18 142 48)" fill="#2E221E" />

  <!-- Continuous Dark Brown Tanuki / Raccoon Mask -->
  <path
    d="M74 72 C70 56 87 53 103 57 C110 59 116 62 120 62 C124 62 130 59 137 57 C153 53 170 56 166 72 C163 87 149 93 136 90 C129 88 124 86 120 86 C116 86 111 88 104 90 C91 93 77 87 74 72 Z"
    fill="#2E221E"
    stroke="#2B1B15"
    stroke-width="3.8"
    stroke-linejoin="round"
  />

  <!-- Big White Eyes Inside Mask -->
  <ellipse cx="97" cy="72" rx="10" ry="9.5" fill="#FFFFFF" />
  <circle cx="97" cy="72" r="6" fill="#2E221E" />
  <circle cx="99.5" cy="69.5" r="2.2" fill="#FFFFFF" />

  <ellipse cx="143" cy="72" rx="10" ry="9.5" fill="#FFFFFF" />
  <circle cx="143" cy="72" r="6" fill="#2E221E" />
  <circle cx="145.5" cy="69.5" r="2.2" fill="#FFFFFF" />

  <!-- Rosy Cheeks -->
  <ellipse cx="74" cy="85" rx="8.5" ry="5.5" fill="#E0705E" fill-opacity="0.5" />
  <ellipse cx="166" cy="85" rx="8.5" ry="5.5" fill="#E0705E" fill-opacity="0.5" />

  <!-- Cream Snout / Muzzle Overlapping Mask Center -->
  <ellipse cx="120" cy="89" rx="20" ry="14" fill="#FFF5EA" stroke="#2B1B15" stroke-width="3.5" />
  <!-- Cute Rounded Pink Nose -->
  <ellipse cx="120" cy="83" rx="5.8" ry="4" fill="#E0705E" />
  <!-- Happy Cat-Bear Smile -->
  <path d="M111 92 C115 98 125 98 129 92" stroke="#2B1B15" stroke-width="3" stroke-linecap="round" />

  <!-- Giant Curved Red Jueyun Chili Pepper Held in Arms -->
  <g transform="translate(120, 134) rotate(-8)">
    <!-- Chili Shadow -->
    <path
      d="M-82 0 C-45 28 45 28 85 -5 C50 16 -35 16 -82 0 Z"
      fill="#8C1D13"
    />
    <!-- Chili Main Body -->
    <path
      d="M-85 -10 C-45 -26 45 -18 85 -5 C45 22 -45 18 -85 -10 Z"
      fill="#D93829"
      stroke="#2B1B15"
      stroke-width="3.8"
      stroke-linejoin="round"
    />
    <!-- Chili Highlight Line -->
    <path d="M-60 -12 C-25 -20 30 -15 65 -6" stroke="#F58B7E" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Green Chili Calyx & Curly Stem -->
    <path d="M-84 -10 C-95 -16 -100 -22 -102 -30 C-98 -26 -92 -20 -86 -14" stroke="#2F855A" stroke-width="4.2" stroke-linecap="round" />
    <path d="M-82 -18 L-88 -6 L-78 -8 Z" fill="#2F855A" stroke="#2B1B15" stroke-width="2" />
    <path d="M-78 -16 L-84 -5 L-74 -6 Z" fill="#38A169" />
  </g>

  <!-- Left Paw (Dark Brown Mitt with Gold Swirl Cuffs) Hugging Chili -->
  <g transform="translate(62, 126)">
    <!-- Arm -->
    <ellipse cx="0" cy="0" rx="17" ry="13" transform="rotate(25)" fill="#F3A847" stroke="#2B1B15" stroke-width="3.8" />
    <!-- Dark Paw -->
    <ellipse cx="8" cy="5" rx="14" ry="11" transform="rotate(15)" fill="#2E221E" stroke="#2B1B15" stroke-width="3.5" />
    <!-- Gold Cloud/Swirl Cuff Trim -->
    <path d="M-3 0 C3 3 8 0 14 3" stroke="#F5C142" stroke-width="2.2" stroke-linecap="round" />
    <!-- Cream Paw Pads -->
    <circle cx="10" cy="6" r="3.2" fill="#FFF5EA" />
    <circle cx="5" cy="2" r="1.8" fill="#FFF5EA" />
    <circle cx="14" cy="4" r="1.8" fill="#FFF5EA" />
  </g>

  <!-- Right Paw Hugging Other Side of Chili -->
  <g transform="translate(178, 126)">
    <!-- Arm -->
    <ellipse cx="0" cy="0" rx="17" ry="13" transform="rotate(-25)" fill="#F3A847" stroke="#2B1B15" stroke-width="3.8" />
    <!-- Dark Paw -->
    <ellipse cx="-8" cy="5" rx="14" ry="11" transform="rotate(-15)" fill="#2E221E" stroke="#2B1B15" stroke-width="3.5" />
    <!-- Gold Cloud/Swirl Cuff Trim -->
    <path d="M3 0 C-3 3 -8 0 -14 3" stroke="#F5C142" stroke-width="2.2" stroke-linecap="round" />
    <!-- Cream Paw Pads -->
    <circle cx="-10" cy="6" r="3.2" fill="#FFF5EA" />
    <circle cx="-5" cy="2" r="1.8" fill="#FFF5EA" />
    <circle cx="-14" cy="4" r="1.8" fill="#FFF5EA" />
  </g>

  <!-- Peeking Bottom Edge Overlay (Resting Naturally on Menu Card Top) -->
  <path d="M40 178 L200 178" stroke="#2B1B15" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.25" />
</svg>
